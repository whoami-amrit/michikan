services:
  redis:
    image: valkey/valkey:9
    container_name: michi_valkey
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - valkey_data:/var/lib/valkey/data

  web:
    image: elessar1802/personal:web
    container_name: michi_web
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    environment:
      NODE_ENV: production
    env_file:
      - .env.prod
    ports:
      - '3000:8000'

  api:
    image: elessar1802/personal:api
    container_name: michi_api
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment:
      NODE_ENV: production
    env_file:
      - .env.prod
    ports:
      - '5252:5252'

  workers:
    image: elessar1802/personal:workers
    container_name: michi_workers
    build:
      context: .
      dockerfile: Dockerfile
      target: workers
    environment:
      NODE_ENV: production
    env_file:
      - .env.prod
    restart: always

volumes:
  valkey_data:
